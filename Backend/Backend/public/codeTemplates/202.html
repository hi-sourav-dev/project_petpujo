<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Awaiting Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e0f7fa;
      position: relative;
    }

    /* Water wave background */
    .background svg {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
    }

    .card {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(15px);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      text-align: center;
      padding: 3rem;
      color: #003c6c;
      animation: fadeIn 1s ease-in-out;
      max-width: 500px;
      z-index: 2;
    }

    h1 {
      font-size: 4rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: #01579b;
    }

    h2 {
      font-size: 1.5rem;
      margin-bottom: 2rem;
    }

    .loader {
      border: 6px solid #bbdefb;
      border-top: 6px solid #0288d1;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 1.5rem auto;
    }

    .footer {
      font-size: 0.9rem;
      color: #004d61;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>202</h1>
    <h2>Accepted - Please Wait for Admin Verification</h2>
    <div class="loader"></div>
    <div class="footer">Your request has been received and is being processed.</div>
  </div>

  <!-- Water Wave SVG Background -->
  <div class="background">
    <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
      <path fill="#81d4fa" fill-opacity="0.5" d="M0,96L48,106.7C96,117,192,139,288,160C384,181,480,203,576,213.3C672,224,768,224,864,192C960,160,1056,96,1152,64C1248,32,1344,32,1392,32L1440,32L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
    </svg>
  </div>
</body>
</html>
