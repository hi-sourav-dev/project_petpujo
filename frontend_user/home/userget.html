<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>USER Front Page</title>
    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('getuser.jpg') no-repeat center center/cover;
    height: 100vh; 
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: white;
    text-align: center;
       
}

/* Add light  Overlay */
body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.1); 
    z-index: -1;
}

header {
    position: absolute;
    top: 20px;
    left: 30px;
    z-index: 10;
}

.logo {
    height: 50px;   /* Change size as needed */
    width: auto;
    color: rgb(161, 163, 227);
}



.main {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 80vh;
    text-align: center;
}

.content {
    background: rgba(0, 0, 0, 0.7);  
    padding: 60px 40px;             
    border-radius: 30px;
    max-width: 1000px;              
    min-height: 250px;  
    width: 90%;
    max-width: 600px;           
    margin: auto;
    text-align: center;            
    display: flex;
    flex-direction: column;
    justify-content: flex-start;      
    align-items: center;         
}

h1 {
    font-size: 60px;
}

p {
    font-size: 40px;
    margin: 10px 0;
    font-family:Georgia, 'Times New Roman', Times, serif;
}
#button {
    background: rgb(228, 65, 65); 
    color: white;
    padding: 15px 30px;
    font-size: 18px;
    font-weight: bold;
    border: none;
    border-radius: 50px;
    cursor: pointer;
    transition: background 0.3s ease-in-out, transform 0.2s;
    display: flex;
    align-items: center;
    gap: 10px;
}

@media (max-width: 768px) {
    .content {
        padding: 30px 15px;
    }

    .content h1 {
        font-size: 28px;
    }

    .content p {
        font-size: 16px;
    }

    #button {
        font-size: 16px;
        padding: 12px 20px;
    }
}

    </style>
</head>
<body>
    <header>
        <div class="logo">EASY PETPUJO</div>
    </header>
    <main>
        <div class="content">
            <h1>WELCOME TO </h1>
            <p>Easy Petpujo</p><br><br><br><br><br>
            <form action="/login/userlogin.html">
                <button id="button">Get Started →</button>
              </form>
              
        </div>
    </main>
</body>
</htmL>
