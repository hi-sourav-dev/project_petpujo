<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login Page</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: url('login.jpg') no-repeat center center/cover;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.1); 
    z-index: -1;
}
    .container {
      background: rgba(0, 0, 0, 0.7);  
      padding: 40px;
      border-radius: 10px;
      width: 300px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    .container h2 {
      text-align: center;
      margin-bottom: 20px;
      color:antiquewhite;
    }

    .container input[type="text"],
    .container input[type="password"] {
      width: 100%;
      padding: 10px;
      margin: 10px 0;
      border: none;
      border-bottom: 2px solid #ccc;
      outline: none;
    }

    .container button {
      width: 100%;
      padding: 10px;
      background: red;
      border: none;
      color: white;
      font-size: 16px;
      cursor: pointer;
      border-radius: 5px;
      margin-top: 10px;
    }

   .options {
      text-align: center;
      margin-top: 15px;
    }

.options span {
    color:rgb(195, 192, 192);
} 
.options a{
    color:#4facfe;
    font-weight: bold;
}
 .options a:hover {
      text-decoration: underline;
      
    }
    

  </style>
</head>
<body>
  <form action="/login" method="POST">
  <div class="container">
    <h2>Login</h2>
    <input type="text" name="username" placeholder="Username" required />
    <input type="text" name="mobile" placeholder="Mobile Number" required />
    <input type="password" name="password"placeholder="Password" required />
    <button>Login</button>
    <div class="options">
      <span>Don't have an account?</span> <a href="/login/usersign.html"><strong>Sign up</strong></a>
    </div>
    
  </div>
</form>

</body>
</html>
